[project]
name = "simplecabinet"
version = "0.2.0"
description = "Android login, local registration and personal account demo"
requires-python = ">=3.10"
dependencies = ["flet==1.0.5"]

[tool.flet]
build_number = 2  # Increment for each new APK update.
org = "com.example"
product = "Мой кабинет"
bundle_id = "com.example.simplecabinet"

[tool.flet.app]
path = "src"
module = "main"

[tool.flet.splash]
color = "#0B1220"
dark_color = "#0B1220"
